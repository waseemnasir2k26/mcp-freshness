[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-freshness"
version = "0.1.0"
description = "Score every configured MCP server for liveness and maintenance freshness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir", email = "hello@skynetjoe.com" }]
keywords = ["mcp", "model-context-protocol", "health-check", "liveness", "freshness", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/waseemnasir2k26/mcp-freshness"
Issues = "https://github.com/waseemnasir2k26/mcp-freshness/issues"

[project.scripts]
mcp-freshness = "mcp_freshness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_freshness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
